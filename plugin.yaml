name: hermes-todo
version: 0.2.1
description: Per-repo todo backlog for Hermes agents — each todo runs as a worker in its own git worktree under guarded state transitions, with prompt drafting, call tracing, /todo verbs and a TUI pane (claude-todo, ported to Hermes)
author: Declan Shanaghy
homepage: https://github.com/declanshanaghy/hermes-todo
license: MIT
tags: [automation, tasks, git]
provides_tools:
  - todo_add
  - todo_backlog
  - todo_update
provides_hooks:
  - subagent_start
  - subagent_stop
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
